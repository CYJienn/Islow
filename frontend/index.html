<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e7ec">
<title>Kaunter</title>
<link rel="preload" href="fonts/pjs-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pipeline.css">
</head>
<body>
<!--
THESIS: A workbench, not a report. The owner pulls widgets from a glass tray onto a dotted canvas and they snap to the dots. The white KPI-card dashboard is refused.
OWN-WORLD: cool-gray ground (#e4e7ec) with white cards, teal #14b8a6 accent, ink-black primary actions, Hornbill orange only for overdue. Plus Jakarta Sans. Soft-shadow cards, dotted lattice in edit mode, glass tiles in the tray only.
STORY: The owner opens it and sees today at a glance (preview layout), taps Edit, drags widgets, saves. English/Malay in Settings.
FIRST VIEWPORT: left magnifying dock, top bar with greeting and freshness chip, dotted canvas holding the six starter widgets.
FORM: sketch-fixed (islow idea 1 pic.pdf); no concept seed rolled.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="i-rem" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-todo" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"/></symbol>
    <symbol id="i-sales" viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></symbol>
    <symbol id="i-spend" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5M9.5 12h5"/></symbol>
    <symbol id="i-meet" viewBox="0 0 24 24"><path d="M4 5h16v11h-8.5L7 20v-4H4z"/><path d="M8 9h8M8 12h5"/></symbol>
    <symbol id="i-owe" viewBox="0 0 24 24"><path d="M4 8h14l-3.2-3.2M20 16H6l3.2 3.2"/></symbol>
    <symbol id="i-pack" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/></symbol>

    <symbol id="i-view" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20v-4L15.5 4.5l4 4L8 20z"/><path d="M13 7l4 4"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 10.5A8 8 0 0 0 6 7M4 4.5V8h3.5"/><path d="M4 13.5A8 8 0 0 0 18 17M20 19.5V16h-3.5"/></symbol>
    <symbol id="i-flow" viewBox="0 0 24 24"><rect x="3.5" y="4" width="7" height="6" rx="1.5"/><rect x="13.5" y="14" width="7" height="6" rx="1.5"/><path d="M10.5 7h3a2 2 0 0 1 2 2v5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="M4 17l5-4.5 4 3 3-2.5 4.5 4"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.8-5.5 7-5.5s6.2 1.9 7 5.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 13h7"/></symbol>
  </defs>
</svg>

<div class="app" id="app" data-mode="view">

  <nav class="dock" id="dock" role="toolbar" aria-orientation="vertical"></nav>

  <div class="main">
    <header class="bar">
      <a class="brand" href="#" aria-label="Kaunter">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#14181f"/><path d="M10 10.5l6 5.5-6 5.5" fill="none" stroke="#14b8a6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 22.5h5" stroke="#14b8a6" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="brand-name" data-i18n="app.name">Kaunter</span>
      </a>
      <div class="hello">
        <h1 id="hello"></h1>
        <p id="today"></p>
      </div>
      <div class="bar-end">
        <span class="chip" id="fresh"></span>
        <button type="button" class="chip chip-mode" id="modeChip"></button>
        <span class="avatar" id="avatar" role="img"></span>
      </div>
    </header>

    <main class="canvas" id="canvas">
      <div class="grid" id="grid" role="region" data-i18n-attr="aria-label:canvas.label">
        <div class="ghost" id="ghost" hidden></div>
      </div>
    </main>

    <section class="pl" id="plView" hidden aria-label="Pipeline">
      <header class="pl-bar">
        <button type="button" class="chip pl-back" id="plBack"></button>
        <div class="pl-head"><h1 id="plTitle"></h1><p id="plHint"></p></div>
      </header>
      <nav class="pl-pick" id="pick" aria-label="Widgets"></nav>
      <div class="pl-cols">
        <div class="pl-wrap">
          <div class="pl-board" id="board" tabindex="0" aria-label="Pipeline canvas. Drag to move, Ctrl and scroll to zoom, plus and minus keys to zoom."><div id="size"><div class="pl-stage" id="stage"></div></div></div>
          <div class="pl-zoom" role="group" aria-label="Zoom">
            <button type="button" id="zOut" aria-label="Zoom out">&minus;</button>
            <button type="button" id="zPct" aria-label="Reset zoom to 100%">100%</button>
            <button type="button" id="zIn" aria-label="Zoom in">+</button>
            <button type="button" id="zFit" aria-label="Fit to screen">Fit</button>
          </div>
        </div>
        <aside class="pl-panel" id="panel" aria-live="polite"></aside>
      </div>
    </section>
  </div>

  <aside class="tray" id="tray" inert data-i18n-attr="aria-label:tray.label">
    <div class="tray-head">
      <h2 data-i18n="tray.title">Widgets</h2>
      <p data-i18n="tray.hint">Drag a widget onto the dotted canvas, or tap it to add.</p>
      <p class="tray-count" id="trayCount"></p>
    </div>
    <div class="tiles" id="tiles"></div>
  </aside>

  <div class="pop" id="popLayouts" role="menu" hidden></div>
  <div class="pop" id="popSettings" role="dialog" hidden>
    <h3 data-i18n="settings.title">Settings</h3>
    <div class="field">
      <span class="field-l" id="langL" data-i18n="settings.lang">Language</span>
      <div class="seg" role="radiogroup" aria-labelledby="langL">
        <button type="button" role="radio" data-lang="en">English</button>
        <button type="button" role="radio" data-lang="ms">Bahasa Malaysia</button>
      </div>
    </div>
    <button type="button" class="btn" id="resetBtn" data-i18n="settings.reset">Reset to starter layout</button>
    <p class="note" data-i18n="settings.demo">Everything shown is synthetic demo data.</p>
  </div>

  <button type="button" class="fab" id="askBtn" data-i18n-attr="aria-label:dock.chat"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg></button>

  <div class="pop pop-chat" id="popChat" role="dialog" hidden>
    <h3 data-i18n="chat.title">Ask WorkBuddy</h3>
    <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
    <form class="chat-form" id="chatForm" autocomplete="off">
      <input id="chatIn" type="text" maxlength="6000" data-i18n-attr="placeholder:chat.placeholder,aria-label:chat.placeholder">
      <button type="submit" class="send" data-i18n="chat.send">Send</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
