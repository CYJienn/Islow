<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — 投资总览</title>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  /* surfaces */
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --surface-3:#F2F4F7;

  /* lines */
  --border:#E9EBEF;
  --border-strong:#DDE1E8;

  /* text */
  --text:#0E1116;
  --text-2:#5B6371;
  --text-3:#8B93A1;

  /* brand — a single calm accent. Deliberately NOT red/green,
     so gain/loss semantics stay unambiguous. */
  --accent:#2F5BD8;
  --accent-hover:#2649B4;
  --accent-soft:#EDF1FE;

  /* market semantics (CN convention: 涨=红, 跌=绿) */
  --up:#D93F3F;
  --up-soft:#FDEEEE;
  --down:#0F9D6E;
  --down-soft:#E9F8F2;

  /* chart ramp (monochrome, keeps charts quiet) */
  --c1:#2F5BD8;
  --c2:#6E8BEA;
  --c3:#A9BCF2;
  --c4:#D3DCF7;

  /* geometry */
  --r-card:12px;
  --r-ctl:8px;
  --r-pill:999px;

  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.03);
  --shadow-md:0 4px 14px rgba(16,24,40,.07), 0 2px 4px rgba(16,24,40,.04);
  --shadow-lg:0 24px 48px -12px rgba(16,24,40,.18);

  --sidebar-w:236px;
  --topbar-h:64px;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;}

/* Every number in this UI is tabular — columns of figures must line up. */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em;}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

/* ============================================================
   App shell
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:14px 12px;
  min-height:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--accent),#6E8BEA);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 2px 6px rgba(47,91,216,.28);
}
.brand-name{font-weight:650;font-size:15px;letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--text-3);margin-top:-1px;}

.nav-label{
  font-size:11px;font-weight:600;color:var(--text-3);
  letter-spacing:.06em;text-transform:uppercase;
  padding:14px 10px 6px;
}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--r-ctl);
  color:var(--text-2);font-size:13.5px;font-weight:500;
  width:100%;text-align:left;position:relative;
  transition:background .13s ease,color .13s ease;
}
.nav-item svg{width:17px;height:17px;flex:none;stroke-width:1.7;}
.nav-item:hover{background:var(--surface-3);color:var(--text);}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-item .badge{
  margin-left:auto;font-size:11px;font-weight:600;
  background:var(--surface-3);color:var(--text-2);
  padding:1px 6px;border-radius:var(--r-pill);
}
.nav-item[aria-current="page"] .badge{background:#fff;color:var(--accent);}

.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
.user-chip{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 8px;border-radius:var(--r-ctl);text-align:left;
  transition:background .13s ease;
}
.user-chip:hover{background:var(--surface-3);}
.avatar{
  width:28px;height:28px;border-radius:50%;flex:none;
  background:var(--surface-3);color:var(--text-2);
  display:grid;place-items:center;font-size:11.5px;font-weight:650;
  border:1px solid var(--border-strong);
}
.user-name{font-size:13px;font-weight:600;line-height:1.25;}
.user-role{font-size:11px;color:var(--text-3);line-height:1.25;}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;}

.topbar{
  height:var(--topbar-h);flex:none;
  display:flex;align-items:center;gap:16px;
  padding:0 24px;
  background:rgba(245,246,248,.85);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
}
.page-title{font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.2;}
.page-sub{font-size:12px;color:var(--text-3);line-height:1.3;}
.topbar-spacer{flex:1;}

.search{
  display:flex;align-items:center;gap:8px;
  width:260px;height:36px;padding:0 10px;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-ctl);color:var(--text-3);
  transition:border-color .13s ease,box-shadow .13s ease;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.search svg{width:16px;height:16px;flex:none;stroke-width:1.9;}
.search input{border:0;background:none;outline:0;width:100%;color:var(--text);font-size:13px;}
.search input::placeholder{color:var(--text-3);}
.kbd{
  font-size:10.5px;font-weight:600;color:var(--text-3);
  border:1px solid var(--border-strong);border-radius:5px;
  padding:1px 5px;background:var(--surface-2);
}

.icon-btn{
  width:36px;height:36px;border-radius:var(--r-ctl);
  display:grid;place-items:center;color:var(--text-2);
  position:relative;transition:background .13s ease,color .13s ease;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text);}
.icon-btn svg{width:18px;height:18px;stroke-width:1.7;}
.dot{
  position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;
  background:var(--up);border:2px solid var(--bg);
}
.ghost-btn{
  height:36px;padding:0 13px;border-radius:var(--r-ctl);
  border:1px solid var(--border-strong);background:var(--surface);
  font-size:13px;font-weight:550;color:var(--text-2);
  display:inline-flex;align-items:center;gap:7px;
  transition:background .13s ease,border-color .13s ease,color .13s ease;
}
.ghost-btn:hover{background:var(--surface-3);color:var(--text);}
.ghost-btn svg{width:15px;height:15px;stroke-width:1.7;}

/* ---------- Content ---------- */
.content{flex:1;overflow-y:auto;padding:22px 24px 48px;min-height:0;}
.content::-webkit-scrollbar{width:10px;height:10px;}
.content::-webkit-scrollbar-thumb{background:#D8DCE3;border-radius:99px;border:3px solid var(--bg);}
.content::-webkit-scrollbar-thumb:hover{background:#C4C9D2;}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);
}
.card-head{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px 0;
}
.card-title{font-size:14px;font-weight:640;letter-spacing:-.01em;}
.card-sub{font-size:12px;color:var(--text-3);margin-top:1px;}
.card-head .spacer{flex:1;}
.card-body{padding:16px 18px 18px;}

/* ---------- KPI cards ---------- */
.kpi{grid-column:span 3;padding:16px 18px 17px;}
.kpi-label{
  display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:550;color:var(--text-2);
}
.kpi-label svg{width:13px;height:13px;stroke-width:1.8;color:var(--text-3);}
.kpi-value{font-size:25px;font-weight:660;letter-spacing:-.03em;margin-top:9px;line-height:1.1;}
.kpi-value .unit{font-size:14px;font-weight:550;color:var(--text-2);margin-left:1px;}
.kpi-foot{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;}
.trend{
  display:inline-flex;align-items:center;gap:3px;
  font-weight:640;padding:2px 6px;border-radius:6px;
}
.trend svg{width:11px;height:11px;stroke-width:2.4;}
.trend.up{color:var(--up);background:var(--up-soft);}
.trend.down{color:var(--down);background:var(--down-soft);}
.kpi-note{color:var(--text-3);}

/* ---------- Charts ---------- */
.perf{grid-column:span 8;}
.alloc{grid-column:span 4;}
.chart-wrap{position:relative;width:100%;}
.chart-wrap svg{display:block;width:100%;overflow:visible;}

/* range segmented control */
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-ctl);padding:2px;gap:2px;}
.seg button{
  padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:550;
  color:var(--text-2);transition:background .13s ease,color .13s ease,box-shadow .13s ease;
}
.seg button:hover{color:var(--text);}
.seg button[aria-pressed="true"]{
  background:var(--surface);color:var(--text);font-weight:640;
  box-shadow:0 1px 2px rgba(16,24,40,.08);
}

.legend{display:flex;gap:16px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);}
.legend-swatch{width:9px;height:9px;border-radius:3px;flex:none;}

/* tooltip */
.tip{
  position:absolute;pointer-events:none;z-index:30;
  background:#0E1116;color:#fff;border-radius:8px;
  padding:9px 11px;font-size:12px;line-height:1.55;
  box-shadow:var(--shadow-lg);white-space:nowrap;
  opacity:0;transform:translate(-50%,-118%);
  transition:opacity .1s ease;
}
.tip.show{opacity:1;}
.tip-title{font-weight:600;color:#B9C0CC;font-size:11px;margin-bottom:5px;letter-spacing:.02em;}
.tip-row{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.tip-row .k{display:flex;align-items:center;gap:6px;color:#B9C0CC;}
.tip-row .v{font-weight:640;font-variant-numeric:tabular-nums;}

/* ---------- Donut ---------- */
.donut-wrap{position:relative;display:grid;place-items:center;padding:4px 0 8px;}
.donut-center{position:absolute;text-align:center;pointer-events:none;}
.donut-center .dc-label{font-size:11.5px;color:var(--text-3);}
.donut-center .dc-value{font-size:19px;font-weight:660;letter-spacing:-.02em;}
.alloc-list{margin-top:12px;display:flex;flex-direction:column;}
.alloc-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 8px;border-radius:var(--r-ctl);cursor:default;
  transition:background .12s ease;
}
.alloc-row:hover,.alloc-row.on{background:var(--surface-3);}
.alloc-row .nm{font-size:13px;font-weight:550;flex:1;}
.alloc-row .amt{font-size:12.5px;color:var(--text-3);}
.alloc-row .pct{font-size:13px;font-weight:640;width:48px;text-align:right;}

/* ---------- Tables ---------- */
.holdings{grid-column:span 8;}
.watch{grid-column:span 4;}
.table-scroll{overflow-x:auto;margin:0 -18px;padding:0 18px;}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
thead th{
  text-align:right;font-size:11.5px;font-weight:600;color:var(--text-3);
  padding:0 10px 9px;border-bottom:1px solid var(--border);white-space:nowrap;
  letter-spacing:.01em;
}
thead th:first-child{text-align:left;padding-left:0;}
thead th:last-child{padding-right:0;}
thead th.sortable{cursor:pointer;user-select:none;transition:color .12s ease;}
thead th.sortable:hover{color:var(--text-2);}
thead th .sort-ic{display:inline-block;vertical-align:-1px;margin-left:3px;opacity:.45;}
thead th[aria-sort] .sort-ic{opacity:1;color:var(--accent);}
tbody td{
  text-align:right;padding:11px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0;}
tbody td:first-child{text-align:left;padding-left:0;}
tbody td:last-child{padding-right:0;}
tbody tr{transition:background .12s ease;}
tbody tr:hover td{background:var(--surface-2);}

.sym{display:flex;align-items:center;gap:10px;}
.sym-ic{
  width:28px;height:28px;border-radius:8px;flex:none;
  display:grid;place-items:center;font-size:10.5px;font-weight:700;
  background:var(--surface-3);color:var(--text-2);letter-spacing:-.02em;
}
.sym-nm{font-weight:600;line-height:1.25;}
.sym-cd{font-size:11.5px;color:var(--text-3);line-height:1.25;font-variant-numeric:tabular-nums;}
.pos{color:var(--up);font-weight:600;}
.neg{color:var(--down);font-weight:600;}
.muted{color:var(--text-3);}

.spark{display:block;width:58px;height:24px;flex:none;}
.spark-lg{width:92px;height:26px;}

/* ---------- Portfolio view extras ---------- */
.strip{
  grid-column:span 12;
  display:grid;grid-template-columns:repeat(4,1fr);
}
.strip-cell{padding:16px 20px;border-right:1px solid var(--border);}
.strip-cell:last-child{border-right:0;}
.strip-label{font-size:12px;color:var(--text-3);font-weight:550;}
.strip-value{font-size:19px;font-weight:650;letter-spacing:-.025em;margin-top:6px;}

.sector{grid-column:span 7;}
.risk{grid-column:span 5;}
.bar-row{display:grid;grid-template-columns:88px 1fr 52px;gap:12px;align-items:center;padding:7px 0;}
.bar-name{font-size:12.5px;color:var(--text-2);font-weight:550;}
.bar-track{display:block;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.bar-fill{display:block;height:100%;border-radius:99px;background:var(--c1);transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-val{font-size:12.5px;font-weight:640;text-align:right;font-variant-numeric:tabular-nums;}

.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;}
.metric{background:var(--surface);padding:15px 16px;}
.metric-k{font-size:12px;color:var(--text-3);font-weight:550;}
.metric-v{font-size:17px;font-weight:650;letter-spacing:-.02em;margin-top:5px;}
.metric-h{font-size:11.5px;color:var(--text-3);margin-top:3px;}

/* ---------- Stub / empty ---------- */
.stub{
  grid-column:span 12;padding:80px 24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.stub-art{
  width:76px;height:76px;border-radius:22px;margin-bottom:14px;
  background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);
}
.stub-art svg{width:34px;height:34px;stroke-width:1.5;}
.stub h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;}
.stub p{margin:0;font-size:13.5px;color:var(--text-3);max-width:400px;}

/* ---------- Drawer (design notes) ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(14,17,22,.34);
  opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50;
}
.scrim.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);
  background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow-lg);z-index:51;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
.drawer.show{transform:none;}
.drawer-head{
  padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:12px;
}
.drawer-head h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;}
.drawer-head p{margin:3px 0 0;font-size:12.5px;color:var(--text-3);}
.drawer-body{overflow-y:auto;padding:18px 20px 40px;}
.note{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--border);}
.note:last-child{border-bottom:0;margin-bottom:0;}
.note h4{margin:0 0 5px;font-size:13px;font-weight:640;display:flex;align-items:center;gap:7px;}
.note h4 .n{
  width:19px;height:19px;border-radius:6px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  font-size:11px;font-weight:700;display:grid;place-items:center;
}
.note p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.6;}
.note code{
  font-size:11.5px;background:var(--surface-3);padding:1px 5px;border-radius:4px;
  color:var(--text-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* ---------- Responsive ---------- */
@media (max-width:1240px){
  .kpi{grid-column:span 6;}
  .perf{grid-column:span 12;}
  .alloc{grid-column:span 12;}
  .holdings{grid-column:span 12;}
  .watch{grid-column:span 12;}
  .sector{grid-column:span 12;}
  .risk{grid-column:span 12;}
  .strip{grid-template-columns:repeat(2,1fr);}
  .strip-cell:nth-child(2){border-right:0;}
  .strip-cell:nth-child(-n+2){border-bottom:1px solid var(--border);}
}
@media (max-width:900px){
  :root{--sidebar-w:64px;}
  .brand-text,.nav-item span,.user-text,.nav-label{display:none;}
  .nav-item{justify-content:center;padding:9px;}
  .nav-item .badge{display:none;}
  .brand{justify-content:center;padding:6px 0 16px;}
  .user-chip{justify-content:center;}
  .search{width:170px;}
}
@media (max-width:640px){
  .kpi{grid-column:span 12;}
  .content{padding:16px 14px 40px;}
  .topbar{padding:0 14px;gap:10px;}
  .page-sub,.search{display:none;}
  .strip{grid-template-columns:1fr;}
  .strip-cell{border-right:0;border-bottom:1px solid var(--border);}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="app">
  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <div class="brand-name">Portfolio</div>
        <div class="brand-sub">资产管理台</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="主导航"></nav>

    <div class="sidebar-foot">
      <button class="user-chip" aria-label="账户菜单">
        <span class="avatar">陈</span>
        <span class="user-text">
          <span class="user-name" style="display:block">陈晓</span>
          <span class="user-role" style="display:block">个人投资者</span>
        </span>
      </button>
    </div>
  </aside>

  <!-- ==================== MAIN ==================== -->
  <div class="main">
    <header class="topbar">
      <div>
        <div class="page-title" id="pageTitle">投资总览</div>
        <div class="page-sub" id="pageSub">2026年10月10日 · 数据更新于 15:00</div>
      </div>
      <div class="topbar-spacer"></div>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="搜索股票、基金、代码…" aria-label="搜索" />
        <span class="kbd">⌘K</span>
      </label>

      <button class="ghost-btn" id="notesBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>
        设计说明
      </button>

      <button class="icon-btn" aria-label="通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
    </header>

    <main class="content" id="view"></main>
  </div>
</div>

<!-- ==================== DESIGN NOTES DRAWER ==================== -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer-head">
    <div style="flex:1">
      <h3 id="drawerTitle">设计说明</h3>
      <p>这套界面为什么这样设计</p>
    </div>
    <button class="icon-btn" id="drawerClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>

function lcg(seed){let s=seed>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296);}

function buildMarketSeries(){
  const rnd=lcg(20261010);
  const dates=[];
  const d=new Date(2025,9,10);
  while(d<=new Date(2026,9,10)){
    const w=d.getDay();
    if(w!==0&&w!==6) dates.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  const n=dates.length;
  const shocks=[],idio=[];
  for(let i=0;i<n;i++){shocks.push((rnd()+rnd()+rnd()-1.5)*1.6);idio.push((rnd()+rnd()-1)*1.6);}

  const port=[182.4],bench=[182.4];
  for(let i=1;i<n;i++){
    port.push(port[i-1]*(1+0.00115+0.0115*shocks[i]+0.0055*idio[i]));
    bench.push(bench[i-1]*(1+0.00062+0.0092*shocks[i]+0.0042*(rnd()*2-1)));
  }
  /* pin the final values to the figures shown in the KPI cards */
  const sp=228.6/port[n-1], sb=201.4/bench[n-1];
  const P=port.map(v=>v*sp), B=bench.map(v=>v*sb);
  return dates.map((dt,i)=>({date:dt,port:P[i],bench:B[i]}));
}

/* --- line + area performance chart --- */
function perfChart(range){
  const now=MARKET[MARKET.length-1].date;
  let from=new Date(now);
  if(range==="1M")from.setMonth(now.getMonth()-1);
  else if(range==="3M")from.setMonth(now.getMonth()-3);
  else if(range==="6M")from.setMonth(now.getMonth()-6);
  else if(range==="YTD")from=new Date(now.getFullYear(),0,1);
  else from=new Date(MARKET[0].date);

  let data=MARKET.filter(d=>d.date>=from);
  if(data.length<2)data=MARKET.slice(-2);

  const H=248, PAD={t:14,r:16,b:26,l:48};
  const vals=data.flatMap(d=>[d.port,d.bench]);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;

  const W=760;
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const X=i=>PAD.l+(data.length===1?iw/2:(i/(data.length-1))*iw);
  const Y=v=>PAD.t+ih-((v-lo)/(hi-lo))*ih;

  const line=k=>data.map((d,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(d[k]).toFixed(1)}`).join(" ");
  const area=`${line("port")} L${X(data.length-1).toFixed(1)} ${PAD.t+ih} L${X(0).toFixed(1)} ${PAD.t+ih} Z`;

  /* 4 horizontal gridlines with tidy labels */
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*(i/3));
  const grid=ticks.map(v=>`
    <line x1="${PAD.l}" y1="${Y(v).toFixed(1)}" x2="${W-PAD.r}" y2="${Y(v).toFixed(1)}"
          stroke="var(--border)" stroke-width="1"/>
    <text x="${PAD.l-10}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end"
          font-size="11" fill="var(--text-3)" font-variant-numeric="tabular-nums">${v.toFixed(0)}</text>`).join("");

  /* x labels — ~6 evenly spaced */
  const step=Math.max(1,Math.floor(data.length/6));
  const xl=data.map((d,i)=>{
    if(i%step!==0&&i!==data.length-1)return "";
    const m=d.date.getMonth()+1;
    return `<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--text-3)">${m}月</text>`;
  }).join("");

  const last=data[data.length-1];
  const lastPt=`<circle cx="${X(data.length-1).toFixed(1)}" cy="${Y(last.port).toFixed(1)}" r="4.5"
      fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>`;

  /* hand the hover geometry to bindPerfHover() through a module-level slot
     (more robust than a JSON <script> block inside a template literal) */
  perfMeta={
    n:data.length, W, H, PAD, lo, hi,
    pts:data.map(d=>({t:d.date.getTime(),p:d.port,b:d.bench}))
  };

  return `
  <div class="chart-wrap" id="perfWrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="组合与基准走势对比">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2F5BD8" stop-opacity=".16"/>
          <stop offset="100%" stop-color="#2F5BD8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}${xl}
      <path d="${area}" fill="url(#areaFill)"/>
      <path d="${line("bench")}" fill="none" stroke="var(--c3)" stroke-width="1.75"
            stroke-dasharray="5 4" stroke-linecap="round"/>
      <path d="${line("port")}" fill="none" stroke="var(--accent)" stroke-width="2.25"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${lastPt}
      <g id="hoverG" style="opacity:0">
        <line id="hoverLine" y1="${PAD.t}" y2="${PAD.t+ih}" stroke="var(--border-strong)" stroke-width="1"/>
        <circle id="hoverDotP" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
        <circle id="hoverDotB" r="3.5" fill="var(--surface)" stroke="var(--c3)" stroke-width="2"/>
      </g>
      <rect id="hitArea" x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>
    </svg>
    <div class="tip" id="perfTip"></div>
  </div>`;
}

/* wire up hover after the SVG is in the DOM */
function bindPerfHover(){
  const wrap=document.getElementById("perfWrap");
  if(!wrap||!perfMeta)return;
  const meta=perfMeta;
  const svgEl=wrap.querySelector("svg");
  const hit=wrap.querySelector("#hitArea");
  const g=wrap.querySelector("#hoverG");
  const line=wrap.querySelector("#hoverLine");
  const dp=wrap.querySelector("#hoverDotP");
  const db=wrap.querySelector("#hoverDotB");
  const tip=document.getElementById("perfTip");
  const {W,H,PAD,lo,hi,n}=meta;
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const X=i=>PAD.l+(n===1?iw/2:(i/(n-1))*iw);
  const Y=v=>PAD.t+ih-((v-lo)/(hi-lo))*ih;

  function move(ev){
    const r=svgEl.getBoundingClientRect();
    const scale=W/r.width;
    const sx=(ev.clientX-r.left)*scale;
    const rel=(sx-PAD.l)/iw;
    let i=Math.round(rel*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    const p=meta.pts[i];
    const d=new Date(p.t);
    const x=X(i), yp=Y(p.p), yb=Y(p.b);

    line.setAttribute("x1",x);line.setAttribute("x2",x);
    dp.setAttribute("cx",x);dp.setAttribute("cy",yp);
    db.setAttribute("cx",x);db.setAttribute("cy",yb);
    g.style.opacity=1;

    tip.innerHTML=`
      <div class="tip-title">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日</div>
      <div class="tip-row"><span class="k"><span class="legend-swatch" style="background:var(--accent)"></span>我的组合</span><span class="v">${p.p.toFixed(2)}万</span></div>
      <div class="tip-row"><span class="k"><span class="legend-swatch" style="background:var(--c3)"></span>沪深300</span><span class="v">${p.b.toFixed(2)}万</span></div>`;
    tip.classList.add("show");
    tip.style.left=(x/W*100)+"%";
    tip.style.top=(Math.min(yp,yb)/H*100)+"%";
  }
  function out(){g.style.opacity=0;tip.classList.remove("show");}

  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",out);
  wrap.addEventListener("mouseleave",out);
}

/* --- donut --- */
function donut(){
  const S=176,cx=S/2,cy=S/2,r=66,sw=18;
  const C=2*Math.PI*r;
  let off=0;
  const arcs=ALLOC.map((a,i)=>{
    const len=C*(a.pct/100);
    const s=`<circle class="arc" data-i="${i}" cx="${cx}" cy="${cy}" r="${r}"
        fill="none" stroke="${a.c}" stroke-width="${sw}"
        stroke-dasharray="${len-2.5} ${C-len+2.5}"
        stroke-dashoffset="${-off}" stroke-linecap="round"
        transform="rotate(-90 ${cx} ${cy})"
        style="transition:stroke-width .18s ease,opacity .18s ease"/>`;
    off+=len;
    return s;
  }).join("");
  return `
  <div class="donut-wrap">
    <svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img" aria-label="资产配置占比">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/>
      ${arcs}
    </svg>
    <div class="donut-center">
      <div class="dc-label" id="dcLabel">总资产</div>
      <div class="dc-value num" id="dcValue">¥228.6万</div>
    </div>
  </div>
  <div class="alloc-list">
    ${ALLOC.map((a,i)=>`
      <div class="alloc-row" data-arc="${i}">
        <span class="legend-swatch" style="background:${a.c}"></span>
        <span class="nm">${a.name}</span>
        <span class="amt num">${fmtMoney(a.amt)}</span>
        <span class="pct num">${a.pct.toFixed(1)}%</span>
      </div>`).join("")}
  </div>`;
}
function bindDonut(){
  const rows=[...document.querySelectorAll("[data-arc]")];
  const arcs=[...document.querySelectorAll(".arc")];
  const label=document.getElementById("dcLabel"),value=document.getElementById("dcValue");
  const total=ALLOC.reduce((s,a)=>s+a.amt,0);
  const reset=()=>{
    arcs.forEach(a=>{a.style.strokeWidth=18;a.style.opacity=1;});
    rows.forEach(r=>r.classList.remove("on"));
    label.textContent="总资产";value.textContent="¥"+(total/10000).toFixed(1)+"万";
  };
  const on=i=>{
    arcs.forEach((a,j)=>{a.style.strokeWidth=j===i?21:18;a.style.opacity=j===i?1:.42;});
    rows.forEach((r,j)=>r.classList.toggle("on",j===i));
    label.textContent=ALLOC[i].name;
    value.textContent=ALLOC[i].pct.toFixed(1)+"%";
  };
  rows.forEach(r=>{
    r.addEventListener("mouseenter",()=>on(+r.dataset.arc));
    r.addEventListener("mouseleave",reset);
  });
  arcs.forEach(a=>{
    a.addEventListener("mouseenter",()=>on(+a.dataset.i));
    a.addEventListener("mouseleave",reset);
  });
}

/* --- sparkline: normalized to fill its box, with a drift that matches the sign --- */
function spark(seed,positive,big){
  const rnd=lcg(seed*7919+13);
  const n=34,raw=[];
  let v=0;
  for(let i=0;i<n;i++){v+=(rnd()-0.5)*1.7;raw.push(v);}
  const drift=positive?1:-1;
  const series=raw.map((x,i)=>x+drift*(i/(n-1))*2.6);
  const lo=Math.min(...series),hi=Math.max(...series),span=(hi-lo)||1;

  const W=big?92:58,H=big?26:24,pad=3;
  const X=i=>i/(n-1)*W;
  const Y=val=>H-pad-((val-lo)/span)*(H-pad*2);
  const d=series.map((val,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(val).toFixed(1)}`).join(" ");
  const col=positive?"var(--up)":"var(--down)";

  return `<svg class="spark${big?" spark-lg":""}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

      <div class="card-body">
        <div class="legend" style="margin-bottom:6px">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--accent)"></span>我的组合 <b class="num" style="color:var(--up)">+25.4%</b></span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--c3)"></span>沪深300 <b class="num" style="color:var(--up)">+10.4%</b></span>
        </div>
        ${perfChart(perfRange)}
      </div>
    </section>

    <section class="card alloc">
      <div class="card-head">
        <div>
          <div class="card-title">资产配置</div>
          <div class="card-sub">按大类资产</div>
        </div>
      </div>
      <div class="card-body">${donut()}</div>
    </section>

    <section class="card holdings">
      <div class="card-head">
        <div>
          <div class="card-title">主要持仓</div>
          <div class="card-sub">按市值排序 · 共 ${HOLDINGS.length} 个标的</div>
        </div>
        <div class="spacer"></div>
        <button class="ghost-btn" data-nav-cta="portfolio">查看全部</button>
      </div>
      <div class="card-body">
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>标的</th><th>持仓</th><th>现价</th><th>市值</th><th>今日</th><th>累计盈亏</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card watch">
      <div class="card-head">
        <div>
          <div class="card-title">自选关注</div>
          <div class="card-sub">实时行情</div>
        </div>
        <div class="spacer"></div>
        <button class="ghost-btn" data-nav-cta="watch">全部</button>
      </div>
      <div class="card-body" style="padding-top:8px">
        ${WATCH.slice(0,5).map(w=>`
          <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)">
            <span style="flex:1;min-width:0">
              <span style="font-weight:600;font-size:13px;display:block">${w.name}</span>
              <span class="sym-cd">${w.code}</span>
            </span>
            ${spark(w.seed,w.chg>=0)}
            <span style="text-align:right;width:76px">
              <span class="num" style="font-weight:600;display:block">${w.price.toFixed(2)}</span>
              <span class="num ${cls(w.chg)}" style="font-size:12px">${fmtPct(w.chg)}</span>
            </span>
          </div>`).join("")}
      </div>
    </section>
  </div>`;
}

let sortKey="mv",sortDir=-1;
function viewPortfolio(){
  const data=[...HOLDINGS].sort((a,b)=>{
    const va=a[sortKey],vb=b[sortKey];
    return (va>vb?1:va<vb?-1:0)*sortDir;
  });
  const th=(key,label)=>`<th class="sortable" data-sort="${key}" ${sortKey===key?`aria-sort="${sortDir<0?"descending":"ascending"}"`:""}>
      ${label}<span class="sort-ic">${svg(ICON.sort,'stroke-width="2"')}</span></th>`;

  const totalMv=HOLDINGS.reduce((s,h)=>s+h.mv,0);
  const totalPnl=HOLDINGS.reduce((s,h)=>s+h.pnl,0);

  return `
  <div class="grid">
    <section class="card strip">
      <div class="strip-cell"><div class="strip-label">持仓市值</div><div class="strip-value num">${fmtMoney(totalMv)}</div></div>
      <div class="strip-cell"><div class="strip-label">浮动盈亏</div><div class="strip-value num ${cls(totalPnl)}">${totalPnl>=0?"+":""}${fmtMoney(totalPnl)}</div></div>
      <div class="strip-cell"><div class="strip-label">持仓成本</div><div class="strip-value num">${fmtMoney(totalMv-totalPnl)}</div></div>
      <div class="strip-cell"><div class="strip-label">整体收益率</div><div class="strip-value num ${cls(totalPnl)}">${fmtPct(totalPnl/(totalMv-totalPnl)*100)}</div></div>
    </section>

    <section class="card sector">
      <div class="card-head">
        <div><div class="card-title">行业分布</div><div class="card-sub">按持仓市值占比</div></div>
      </div>
      <div class="card-body">
        ${SECTORS.map(s=>`
          <div class="bar-row">
            <span class="bar-name">${s.name}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${(s.pct/25*100).toFixed(0)}%"></span></span>
            <span class="bar-val">${s.pct.toFixed(1)}%</span>
          </div>`).join("")}
      </div>
    </section>

    <section class="card risk">
      <div class="card-head">
        <div><div class="card-title">风险指标</div><div class="card-sub">近12个月 · 基于日频收益</div></div>
      </div>
      <div class="card-body">
        <div class="metric-grid">
          <div class="metric"><div class="metric-k">年化波动率</div><div class="metric-v num">14.2%</div><div class="metric-h">基准 12.8%</div></div>
          <div class="metric"><div class="metric-k">最大回撤</div><div class="metric-v num neg">-8.6%</div><div class="metric-h">发生于 3月</div></div>
          <div class="metric"><div class="metric-k">夏普比率</div><div class="metric-v num">1.68</div><div class="metric-h">风险调整后收益</div></div>
          <div class="metric"><div class="metric-k">Beta 系数</div><div class="metric-v num">0.92</div><div class="metric-h">略低于市场</div></div>
        </div>
      </div>
    </section>

    <section class="card" style="grid-column:span 12">
      <div class="card-head">
        <div><div class="card-title">全部持仓</div><div class="card-sub">点击表头排序</div></div>
        <div class="spacer"></div>
        <button class="ghost-btn">${svg(ICON.report)}导出</button>
      </div>
      <div class="card-body">
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>标的</th><th>持仓</th><th>成本价</th><th>现价</th>
              ${th("mv","市值")}${th("day","今日")}${th("pnlPct","累计盈亏")}
            </tr></thead>
            <tbody>
              ${data.map(h=>`
                <tr>
                  <td><div class="sym">
                    <span class="sym-ic">${h.tag}</span>
                    <span><span class="sym-nm">${h.name}</span><span class="sym-cd" style="display:block">${h.code}</span></span>
                  </div></td>
                  <td class="num muted">${int0.format(h.qty)}</td>
                  <td class="num muted">${h.cost.toFixed(2)}</td>
                  <td class="num">${h.price.toFixed(2)}</td>
                  <td class="num" style="font-weight:600">${int0.format(h.mv)}</td>
                  <td class="num ${cls(h.day)}">${fmtPct(h.day)}</td>
                  <td class="num ${cls(h.pnlPct)}" style="font-weight:640">${fmtPct(h.pnlPct)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>`;
}

function viewWatch(){
  return `
  <div class="grid">
    <section class="card" style="grid-column:span 12">
      <div class="card-head">
        <div><div class="card-title">自选列表</div><div class="card-sub">点击星标可移除 · 支持拖拽排序</div></div>
        <div class="spacer"></div>
        <button class="ghost-btn">${svg(ICON.watch)}添加标的</button>
      </div>
      <div class="card-body">
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>标的</th><th>最新价</th><th>涨跌幅</th><th>近30日走势</th><th>持仓</th><th>操作</th>
            </tr></thead>
            <tbody>
              ${WATCH.map(w=>{
                const held=HOLDINGS.find(h=>w.code.includes(h.code)||h.code.includes(w.code));
                return `<tr>
                  <td><div class="sym">
                    <span class="sym-ic">${w.name.slice(0,1)}</span>
                    <span><span class="sym-nm">${w.name}</span><span class="sym-cd" style="display:block">${w.code}</span></span>
                  </div></td>
                  <td class="num" style="font-weight:600">${w.price.toFixed(2)}</td>
                  <td class="num ${cls(w.chg)}">${fmtPct(w.chg)}</td>
                  <td>${spark(w.seed,w.chg>=0,true)}</td>
                  <td class="num ${held?"":"muted"}">${held?int0.format(held.qty):"—"}</td>
                  <td><button class="ghost-btn" style="height:30px;padding:0 10px;font-size:12.5px">${held?"加仓":"买入"}</button></td>
                </tr>`;}).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>`;
}

function viewStub(title,sub,icon){
  return `
  <div class="grid">
    <section class="card stub">
      <div class="stub-art">${svg(ICON[icon])}</div>
      <h3>${title}模块</h3>
      <p>${sub}</p>
      <button class="ghost-btn" style="margin-top:18px" data-nav-cta="overview">返回投资总览</button>
    </section>
  </div>`;
}

/* ============================================================
   7. RENDER
   ============================================================ */
const viewEl=document.getElementById("view");

function render(){
  if(currentView==="overview")     viewEl.innerHTML=viewOverview();
  else if(currentView==="portfolio")viewEl.innerHTML=viewPortfolio();
  else if(currentView==="watch")   viewEl.innerHTML=viewWatch();
  else{
    const map={
      market:["行情中心","实时行情、分时与深度盘口将在下一版本接入。当前版本聚焦资产总览与持仓分析。","market"],
      trade:["交易记录","成交明细、资金流水与对账单导出将在下一版本接入。","trade"],
      research:["研究观点","机构研报、策略信号与个股评级将在下一版本接入。","research"],
      report:["报表导出","业绩归因、税务报表与自定义时间区间导出将在下一版本接入。","report"]
    };
    const m=map[currentView]||map.market;
    viewEl.innerHTML=viewStub(m[0],m[1],m[2]);
  }
  bind();
}

function bind(){
  /* CTA buttons that jump between views */
  viewEl.querySelectorAll("[data-nav-cta]").forEach(b=>{
    b.addEventListener("click",()=>go(b.dataset.navCta));
  });

  /* range segmented control */
  const seg=document.getElementById("rangeSeg");
  if(seg){
    seg.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click",()=>{
        perfRange=b.dataset.range;
        seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
        const wrap=document.getElementById("perfWrap");
        const card=wrap.closest(".card-body");
        card.innerHTML=`<div class="legend" style="margin-bottom:6px">
            <span class="legend-item"><span class="legend-swatch" style="background:var(--accent)"></span>我的组合 <b class="num" style="color:var(--up)">+25.4%</b></span>
            <span class="legend-item"><span class="legend-swatch" style="background:var(--c3)"></span>沪深300 <b class="num" style="color:var(--up)">+10.4%</b></span>
          </div>${perfChart(perfRange)}`;
        bindPerfHover();
      });
    });
  }
  bindPerfHover();
  bindDonut();

  /* table sorting (portfolio view) */
  viewEl.querySelectorAll("th[data-sort]").forEach(th=>{
    th.addEventListener("click",()=>{
      const k=th.dataset.sort;
      if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}
      render();
    });
  });
}

/* ============================================================
   8. DESIGN NOTES DRAWER
   ============================================================ */
const NOTES=[
  ["左侧固定导航 + 右侧内容区","这是 B 端与金融类产品最普遍的骨架。用户在 7 个模块间高频切换，把导航常驻在左侧，避免每进一个页面都重新定位入口，切换成本接近于零。"],
  ["信息层级：先看结论，再看细节","总览页第一屏是 4 张 KPI 卡——总资产、今日盈亏、年化收益、可用资金。用户打开仪表盘的第一诉求是「我今天怎么样」，而不是「明细在哪」。结论前置，明细下移。"],
  ["涨红跌绿（中国市场惯例）","颜色语义严格遵循 A 股习惯：<code>涨=红</code>、<code>跌=绿</code>。这和国际市场相反，若照搬欧美配色，中国用户会在第一眼读错方向。"],
  ["品牌色刻意避开红绿","强调色选用<code>蓝 #2F5BD8</code>，把红色和绿色完整留给涨跌语义。如果品牌色是红色，用户将无法判断红色按钮是「上涨」还是「主操作」。"],
  ["所有数字使用等宽对齐","金额、涨跌幅、持仓量统一使用 <code>tabular-nums</code> 等宽数字，并右对齐。数字列上下对齐后，用户扫视时能快速比较量级，这是金融表格的硬性要求。"],
  ["表格优先于卡片列表","持仓、自选都用表格而非卡片。金融数据的比较场景远多于浏览场景，列对齐带来的比较效率高于卡片的美观度。"],
  ["图表只保留一条强调色","走势图用蓝色实线表示组合、浅蓝虚线表示基准，填充使用极淡渐变。图表越安静，异常点越容易被发现。"],
  ["交互即时反馈","时间范围切换、表头排序、环形图悬停、走势图十字准线均即时响应，不需要刷新或跳转。用户每一次操作都能立刻看到结果。"],
  ["空状态也说人话","未接入的模块不显示「404」或空白，而是明确告知该模块的内容与「将在下一版本接入」，并给出返回路径，避免用户以为系统故障。"],
  ["可访问性","所有交互元素带 <code>focus-visible</code> 焦点环，导航使用 <code>aria-current</code>，图表与环形图带 <code>aria-label</code>，并支持 <code>prefers-reduced-motion</code> 关闭动效。"]
];
function renderNotes(){
  document.getElementById("drawerBody").innerHTML=NOTES.map((n,i)=>`
    <div class="note">
      <h4><span class="n">${i+1}</span>${n[0]}</h4>
      <p>${n[1]}</p>
    </div>`).join("");
}
const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");
function openNotes(){renderNotes();drawer.classList.add("show");scrim.classList.add("show");drawer.setAttribute("aria-hidden","false");}
function closeNotes(){drawer.classList.remove("show");scrim.classList.remove("show");drawer.setAttribute("aria-hidden","true");}
document.getElementById("notesBtn").addEventListener("click",openNotes);
document.getElementById("drawerClose").addEventListener("click",closeNotes);
scrim.addEventListener("click",closeNotes);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeNotes();});

/* ============================================================
   9. BOOT
   ============================================================ */
renderNav();
render();
</script>
